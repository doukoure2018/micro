# =====================================================================================
# Pile de TEST — test.digi-creditrural-io.com (lot 0 de l application mobile, 12/11/2026)
#
# Ne dessert QUE les conteneurs suffixes -test. Deux d entre eux seulement rejoignent le
# reseau de production et sont donc joignables d ici : la passerelle et le serveur
# d autorisation. Tout le reste de l API passe par la passerelle, comme le fait un
# telephone — c est voulu : le service utilisateur et le service credit de test restent
# hors de portee du reseau de production.
#
# Les noms sont resolus a chaque appel (resolver + variable) : un conteneur de test
# redemarre change d adresse, et nginx garderait sinon l ancienne, ce qui rendrait 502.
# =====================================================================================
server {
    listen 80;
    server_name test.digi-creditrural-io.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test.digi-creditrural-io.com;

    ssl_certificate     /etc/letsencrypt/live/test.digi-creditrural-io.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.digi-creditrural-io.com/privkey.pem;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 valid=10s;

    # OAuth2 : garder /auth/ dans le chemin transmis.
    location /auth/ {
        set $auth_test authorizationserver-test:8080;
        proxy_pass http://$auth_test$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect http://authorizationserver-test:8080/auth/ https://$host/auth/;
    }

    # API metier, par la passerelle de test.
    location /ecredit/ {
        set $gw_test gateway-test:8000;
        proxy_pass http://$gw_test$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 180s;
    }

    location /user/ {
        set $gw_user gateway-test:8000;
        proxy_pass http://$gw_user$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # Prefixe /api/ : meme passerelle, prefixe retire.
    location /api/ {
        set $gw_api gateway-test:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 180s;
    }

    # L application web de test quand son conteneur tourne (profil web) ; sinon une page
    # texte, au lieu d une erreur 502. Le repli 404 sert les routes Angular, comme en production.
    location / {
        set $app_test digicrg-app-test:4200;
        proxy_pass http://$app_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 = @angular_test;
        error_page 502 503 504 = @sans_application;
    }

    location @angular_test {
        set $app_test_repli digicrg-app-test:4200;
        proxy_pass http://$app_test_repli;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @sans_application {
        default_type text/plain;
        return 200 "DIGI-CRG — environnement de TEST. API en service ; l application web de test n est pas demarree.\n";
    }
}
