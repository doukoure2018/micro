spring:
  application:
    name: gateway
  # IMPORTANT : ce gateway est spring-cloud-starter-gateway-mvc (servlet). Son client
  # HTTP de proxy lit spring.http.client.* ; le read-timeout par defaut coupe les appels
  # lents (lectures SAF de la synthese DG ~10s). On le releve a 120s.
  http:
    client:
      connect-timeout: 15s
      read-timeout: 120s
  cloud:
    discovery:
      enabled: true
    gateway:
      mvc:
        http-client:
          connect-timeout: 15s
          read-timeout: 120s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USERSERVICE
          predicates:
            - Path=/user/**,/agents/**
        - id: ebanking
          uri: lb://EBANKING
          predicates:
            - Path=/ebanking/**
        - id: notification-service
          uri: lb://NOTIFICATIONSERVICE
          predicates:
            - Path=/notification/**
        - id: ecredit-service
          uri: lb://ECREDITSERVICE
          predicates:
            - Path=/ecredit/**

eureka:
  instance:
    prefer-ip-address: true
    hostname: gateway
    ip-address: 51.91.254.218
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://admin:admin2711@discoveryserver:5002/eureka/
    fetch-registry: true
    register-with-eureka: true
    eureka-server-connect-timeout-seconds: 30
    eureka-server-read-timeout-seconds: 30

logging:
  level:
    com.netflix.discovery: INFO
    org.springframework.cloud.netflix: INFO

server:
  port: 8000

jwks:
  uri: http://authorizationserver:8080/auth/oauth2/jwks
