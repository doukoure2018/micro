spring:
  application:
    name: notificationservice

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: ${MAIL_FROM_NAME:DIGI-CRG}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          connectiontimeout: 5000
          timeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  cloud:
    discovery:
      client:
        composite-indicator:
          enabled: true

  datasource:
    url: jdbc:postgresql://postgresdb:5432/localdb
    username: user2711
    password: admin2711
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 3

  main:
    allow-bean-definition-overriding: true

  jpa:
    database: POSTGRESQL
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: localdb

  kafka:
    bootstrap-servers:
      - kafka:9092
    template:
      default-topic: NOTIFICATION_TOPIC
    consumer:
      group-id: topicgroupid
      # Un message traite et valide a la fois. L'envoi des courriels est volontairement espace
      # (1,2 s par message, Gmail refuse au-dela) : avec le lot par defaut de 500, un envoi de
      # masse depassait max.poll.interval.ms = 5 min, le consommateur etait exclu du groupe et
      # tout le lot repartait du debut — 189 agents ont recu le digest du 24/10/2026 deux fois,
      # et les syntheses placees en fin de lot ne sont jamais parties.
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 600000
        fetch.message.max.bytes: 1300000000
        max.partition.fetch.bytes: 1300000000
        spring.json.trusted.packages: "io.digiservices.notificationservice.domain,io.digiservices.userservice.domain"
    properties:
      spring:
        json:
          type:
            mapping: Notification:io.digiservices.notificationservice.domain.Notification
      fetch.message.max.bytes: 1300000000

eureka:
  instance:
    prefer-ip-address: true
    hostname: notificationservice
  client:
    service-url:
      defaultZone: http://admin:admin2711@discoveryserver:5002/eureka/

ui:
  app:
    url: http://51.91.254.218:4200

verify:
  email:
    host: ${UI_APP_URL:http://localhost:4200}
key:
  private: private.key
  public: public.key

server:
  port: 8086
  tomcat:
    max-threads: 100
    min-spare-threads: 10

jwks:
  uri: http://authorizationserver:8080/auth/oauth2/jwks
