spring:
  application:
    name: notificationservice
  profiles:
    active: default
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: ${MAIL_FROM_NAME:DIGI-CRG}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          connectiontimeout: 5000
          timeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  cloud:
    discovery:
      client:
        composite-indicator:
          enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/localdb
    username: user2711
    password: admin2711
    hikari:
      connection-test-query: SELECT 1
  main:
    allow-bean-definition-overriding: true

  jpa:
    database: POSTGRESQL
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: localdb

  kafka:
    bootstrap-servers:
      - localhost:9092
    template:
      default-topic: NOTIFICATION_TOPIC
    consumer:
      group-id: topicgroupid
      # Un message traite et valide a la fois. L'envoi des courriels est volontairement espace
      # (1,2 s par message, Gmail refuse au-dela) : avec le lot par defaut de 500, un envoi de
      # masse depassait max.poll.interval.ms = 5 min, le consommateur etait exclu du groupe et
      # tout le lot repartait du debut — 189 agents ont recu le digest du 24/10/2026 deux fois,
      # et les syntheses placees en fin de lot ne sont jamais parties.
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Add consumer configuration for large messages
      properties:
        max.poll.interval.ms: 600000
        fetch.message.max.bytes: 1300000000
        max.partition.fetch.bytes: 1300000000
    properties:
      spring:
        json:
          type:
            mapping: Notification:io.digiservices.notificationservice.domain.Notification
      # Add global properties for handling large messages
      fetch.message.max.bytes: 1300000000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:admin2711@localhost:5002/eureka/

ui:
  app:
    url: http://localhost:4200


verify:
  email:
    host: http://localhost:4200

key:
  private: private.key
  public: public.key


server:
  port: 8086

jwks:
  uri: http://localhost:8080/oauth2/jwks
